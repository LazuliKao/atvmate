[package]
name = "atvmate"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[features]
default = ["usb"]
usb = ["adb_client/usb"]

[dependencies]
adb_client = "3.0.1"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
poem = { version = "3", features = ["static-files", "test", "websocket"] }
poem-openapi = { version = "5", features = ["swagger-ui"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
